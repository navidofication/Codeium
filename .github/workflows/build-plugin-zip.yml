name: Build plugin ZIP

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build ZIP
        run: python tools/build-zip.py personalized-city-tour.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: personalized-city-tour
          path: personalized-city-tour.zip
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: personalized-city-tour.zip
